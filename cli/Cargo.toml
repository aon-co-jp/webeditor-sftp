[package]
name = "webeditor-sidecar"
version = "0.1.0"
edition = "2021"
description = "webeditor-sftpのコアロジック(webeditor-core)をVSCode拡張機能から呼び出すためのサイドカーCLI。stdin/stdoutでJSON1行=1リクエスト/レスポンスのプロトコルを話す。"

[[bin]]
name = "webeditor-sidecar"
path = "src/main.rs"

[dependencies]
webeditor-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
