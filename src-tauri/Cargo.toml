[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# QRコード生成が実際にデコード可能であることを検証するテスト専用。
# カメラハードウェアを使わずに「エンコード内容が正しくスキャンできる」
# ことを保証する(モバイル実機でのカメラ動作そのものは別途要検証)。
rqrr = "0.7"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SFTP鍵管理: 鍵ペア生成・OSセキュアストレージ・SFTP接続
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2"
keyring = "3"
rand = "0.8"
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }

# 端末間の鍵ペアリング用QRコード生成
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }

async-trait = "0.1"
dirs = "5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
